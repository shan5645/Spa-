<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Therapists - Serenity Spa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #FAF7F2;
            --soft-beige: #E8DFD0;
            --warm-sand: #D4C5B0;
            --sage: #A8B5A0;
            --deep-sage: #7A8B7F;
            --charcoal: #3A3A3A;
            --white: #FFFFFF;
            --gold-accent: #C9A77C;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--cream);
            color: var(--charcoal);
            line-height: 1.7;
            overflow-x: hidden;
        }

        /* Login Screen */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--soft-beige) 0%, var(--cream) 100%);
        }

        .login-box {
            background: var(--white);
            padding: 3rem;
            border-radius: 2px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
        }

        .login-box h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            color: var(--deep-sage);
            margin-bottom: 0.5rem;
            text-align: center;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .login-box p {
            text-align: center;
            color: var(--charcoal);
            opacity: 0.7;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--charcoal);
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid var(--soft-beige);
            border-radius: 2px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--sage);
        }

        .login-btn {
            width: 100%;
            background: var(--sage);
            color: var(--white);
            padding: 1rem;
            border: none;
            border-radius: 2px;
            font-size: 1rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
            font-weight: 400;
        }

        .login-btn:hover {
            background: var(--deep-sage);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(168, 181, 160, 0.3);
        }

        .error-message {
            color: #d9534f;
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        /* Main Content (Hidden Until Login) */
        .main-content {
            display: none;
        }

        .main-content.active {
            display: block;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, rgba(168, 181, 160, 0.15) 0%, rgba(212, 197, 176, 0.1) 100%);
            backdrop-filter: blur(10px);
            padding: 1.5rem 0;
            border-bottom: 1px solid rgba(168, 181, 160, 0.2);
        }

        nav {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            font-weight: 300;
            color: var(--deep-sage);
            letter-spacing: 3px;
        }

        .logout-btn {
            background: var(--sage);
            color: var(--white);
            padding: 0.6rem 1.5rem;
            border: none;
            border-radius: 2px;
            font-size: 0.9rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
        }

        .logout-btn:hover {
            background: var(--deep-sage);
        }

        /* Hero Section */
        .hero {
            padding: 5rem 3rem 3rem;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
            text-align: center;
            opacity: 0;
            animation: fadeInUp 1s ease forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
            from {
                opacity: 0;
                transform: translateY(20px);
            }
        }

        .hero h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 4rem;
            font-weight: 300;
            color: var(--deep-sage);
            line-height: 1.2;
            margin-bottom: 1rem;
            letter-spacing: 3px;
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--charcoal);
            opacity: 0.8;
            max-width: 700px;
            margin: 0 auto 3rem;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        /* Filter Section */
        .filter-section {
            max-width: 1400px;
            margin: 0 auto 3rem;
            padding: 0 3rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.6rem 1.5rem;
            background: var(--white);
            border: 1px solid var(--soft-beige);
            border-radius: 25px;
            color: var(--charcoal);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 0.5px;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--sage);
            color: var(--white);
            border-color: var(--sage);
        }

        /* Therapists Grid */
        .therapists-container {
            max-width: 1400px;
            margin: 0 auto 6rem;
            padding: 0 3rem;
        }

        .therapists-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 3rem;
            opacity: 0;
            animation: fadeInUp 1s ease 0.2s forwards;
        }

        .therapist-card {
            background: var(--white);
            border-radius: 2px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            transition: all 0.4s ease;
        }

        .therapist-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        .therapist-image {
            height: 300px;
            background: linear-gradient(135deg, var(--soft-beige) 0%, var(--warm-sand) 100%);
            position: relative;
            overflow: hidden;
        }

        .therapist-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .therapist-initials {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cormorant Garamond', serif;
            font-size: 5rem;
            color: var(--sage);
            font-weight: 300;
        }

        .availability-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            padding: 0.5rem 1rem;
            border-radius: 25px;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            backdrop-filter: blur(10px);
        }

        .available {
            background: rgba(168, 181, 160, 0.9);
            color: var(--white);
        }

        .busy {
            background: rgba(217, 83, 79, 0.9);
            color: var(--white);
        }

        .therapist-info {
            padding: 2rem;
        }

        .therapist-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            color: var(--deep-sage);
            margin-bottom: 0.5rem;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .therapist-specialization {
            color: var(--sage);
            font-size: 0.95rem;
            margin-bottom: 1rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .therapist-experience {
            color: var(--charcoal);
            font-size: 0.9rem;
            opacity: 0.7;
            margin-bottom: 1rem;
        }

        .therapist-bio {
            color: var(--charcoal);
            font-size: 0.95rem;
            line-height: 1.7;
            opacity: 0.85;
            margin-bottom: 1.5rem;
        }

        .book-therapist-btn {
            width: 100%;
            background: var(--sage);
            color: var(--white);
            padding: 0.9rem;
            border: none;
            border-radius: 2px;
            font-size: 0.95rem;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
            font-weight: 400;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .book-therapist-btn:hover {
            background: var(--deep-sage);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(168, 181, 160, 0.3);
        }

        .book-therapist-btn.disabled {
            background: var(--soft-beige);
            color: var(--charcoal);
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            pointer-events: none;
        }

        @media (max-width: 968px) {
            .hero h1 {
                font-size: 2.5rem;
            }

            .therapists-grid {
                grid-template-columns: 1fr;
            }

            nav {
                padding: 0 2rem;
            }

            .hero,
            .therapists-container,
            .filter-section {
                padding: 0 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-container">
        <div class="login-box">
            <h1>SERENITY</h1>
            <p>Therapist Directory Access</p>
            <form id="loginForm">
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="login-btn">VIEW THERAPISTS</button>
                <p class="error-message" id="errorMessage">Incorrect password. Please try again.</p>
            </form>
        </div>
    </div>

    <!-- Main Content (After Login) -->
    <div id="mainContent" class="main-content">
        <header>
            <nav>
                <div class="logo">SERENITY - THERAPISTS</div>
                <button class="logout-btn" onclick="logout()">LOGOUT</button>
            </nav>
        </header>

        <section class="hero">
            <h1>Our Expert Therapists</h1>
            <p>Meet our team of certified wellness professionals, each bringing unique expertise and a passion for healing to your doorstep.</p>
        </section>

        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">All Therapists</button>
            <button class="filter-btn" data-filter="available">Available Now</button>
            <button class="filter-btn" data-filter="deep-tissue">Deep Tissue</button>
            <button class="filter-btn" data-filter="swedish">Swedish</button>
            <button class="filter-btn" data-filter="aromatherapy">Aromatherapy</button>
            <button class="filter-btn" data-filter="thai">Thai</button>
        </div>

        <div class="therapists-container">
            <div class="therapists-grid" id="therapistsList">
                <!-- Therapists will be loaded here -->
            </div>
        </div>
    </div>

    <script>
        // PASSWORD CONFIGURATION - CHANGE THIS!
        const ACCESS_PASSWORD = 'serenity2026';

        // CUSTOMIZE YOUR THERAPISTS HERE
        const therapists = [
            {
                name: 'Sarah Martinez',
                specialization: ['Deep Tissue', 'Sports Massage'],
                experience: 8,
                status: 'available', // 'available' or 'busy'
                bio: 'Sarah is a certified massage therapist with over 8 years of experience specializing in sports injuries and chronic pain relief. Her deep tissue techniques have helped countless clients recover from physical strain and restore mobility.',
                image: '' // Leave empty to show initials, or add image path like 'images/sarah.jpg'
            },
            {
                name: 'Emily Chen',
                specialization: ['Swedish', 'Aromatherapy'],
                experience: 5,
                status: 'available',
                bio: 'Emily combines the gentle art of Swedish massage with the therapeutic benefits of aromatherapy. Her calming presence and expert touch create a deeply relaxing experience that soothes both body and mind.',
                image: ''
            },
            {
                name: 'Michael Johnson',
                specialization: ['Thai'],
                experience: 10,
                status: 'busy',
                bio: 'Trained in traditional Thai massage techniques in Bangkok, Michael brings authentic healing practices to every session. His expertise in assisted stretching and energy work has earned him a loyal following.',
                image: ''
            },
            {
                name: 'Priya Sharma',
                specialization: ['Aromatherapy', 'Swedish'],
                experience: 6,
                status: 'available',
                bio: 'Priya specializes in holistic wellness approaches, blending essential oils with therapeutic massage. Her gentle techniques promote deep relaxation and emotional balance.',
                image: ''
            },
            {
                name: 'David Kim',
                specialization: ['Deep Tissue', 'Thai'],
                experience: 7,
                status: 'available',
                bio: 'David excels in addressing chronic muscle tension and postural imbalances. His combination of deep tissue and Thai techniques provides comprehensive relief for active individuals.',
                image: ''
            }
        ];

        let currentFilter = 'all';

        // Authentication
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const password = document.getElementById('password').value;
            
            if (password === ACCESS_PASSWORD) {
                localStorage.setItem('therapistAccess', 'true');
                showMainContent();
            } else {
                document.getElementById('errorMessage').classList.add('show');
                document.getElementById('password').value = '';
            }
        });

        function checkAuth() {
            if (localStorage.getItem('therapistAccess') === 'true') {
                showMainContent();
            }
        }

        function showMainContent() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainContent').classList.add('active');
            renderTherapists();
        }

        function logout() {
            localStorage.removeItem('therapistAccess');
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('mainContent').classList.remove('active');
            document.getElementById('password').value = '';
            document.getElementById('errorMessage').classList.remove('show');
        }

        // Render therapists
        function renderTherapists() {
            const container = document.getElementById('therapistsList');
            let filteredTherapists = therapists;

            // Apply filter
            if (currentFilter === 'available') {
                filteredTherapists = therapists.filter(t => t.status === 'available');
            } else if (currentFilter !== 'all') {
                filteredTherapists = therapists.filter(t => 
                    t.specialization.some(s => s.toLowerCase().includes(currentFilter))
                );
            }

            container.innerHTML = filteredTherapists.map(therapist => {
                const initials = therapist.name.split(' ').map(n => n[0]).join('');
                const specializationText = therapist.specialization.join(' • ');
                const isAvailable = therapist.status === 'available';
                const firstName = therapist.name.split(' ')[0];

                return `
                    <div class="therapist-card">
                        <div class="therapist-image">
                            ${therapist.image ? 
                                `<img src="${therapist.image}" alt="${therapist.name}">` :
                                `<div class="therapist-initials">${initials}</div>`
                            }
                            <span class="availability-badge ${isAvailable ? 'available' : 'busy'}">
                                ${isAvailable ? '● Available' : '● Busy'}
                            </span>
                        </div>
                        <div class="therapist-info">
                            <h3 class="therapist-name">${therapist.name}</h3>
                            <p class="therapist-specialization">${specializationText}</p>
                            <p class="therapist-experience">${therapist.experience} years of experience</p>
                            <p class="therapist-bio">${therapist.bio}</p>
                            <a href="https://wa.me/YOUR_PHONE_NUMBER?text=Hi%2C%20I%27d%20like%20to%20book%20${therapist.name}%20for%20a%20massage%20session" 
                               class="book-therapist-btn ${!isAvailable ? 'disabled' : ''}" 
                               target="_blank">
                                ${isAvailable ? 'BOOK ' + firstName.toUpperCase() : 'CURRENTLY UNAVAILABLE'}
                            </a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Filter functionality
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                renderTherapists();
            });
        });

        // Check auth on page load
        checkAuth();
    </script>
</body>
</html>
